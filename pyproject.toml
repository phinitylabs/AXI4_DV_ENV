[project]
name = "problem3-axi4-sva"
version = "0.1.0"
description = "AXI4 SVA Assertion Generation Benchmark"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

